<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>花瓣麵包坊 🍞</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Microsoft JhengHei", "PingFang TC", sans-serif; }

  body {
    background: #FFF8F0;
    color: #4A3728;
    overflow-x: hidden;
  }

  /* ===== 頂部導航列 ===== */
  header {
    position: sticky; top: 0; z-index: 100;
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 5%;
    background: rgba(255, 248, 240, 0.95);
    backdrop-filter: blur(8px);
    box-shadow: 0 2px 12px rgba(160, 110, 60, 0.15);
  }
  .logo { font-size: 26px; font-weight: bold; color: #B0733A; cursor: pointer; }
  .logo span { font-size: 30px; }

  /* ===== 購物車按鈕 ===== */
  .cart-btn {
    position: relative;
    background: #B0733A; color: #fff; border: none;
    font-size: 18px; padding: 10px 22px; border-radius: 30px;
    cursor: pointer; transition: transform .2s;
  }
  .cart-btn:hover { transform: scale(1.08); }
  .cart-btn.shake { animation: shake .5s; }
  @keyframes shake {
    0%,100% { transform: rotate(0); }
    20% { transform: rotate(-12deg) scale(1.15); }
    40% { transform: rotate(10deg); }
    60% { transform: rotate(-8deg); }
    80% { transform: rotate(6deg); }
  }
  .cart-count {
    position: absolute; top: -8px; right: -8px;
    background: #E2584D; color: #fff; font-size: 13px; font-weight: bold;
    min-width: 24px; height: 24px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    padding: 0 5px; border: 2px solid #FFF8F0;
    transition: transform .3s;
  }
  .cart-count.pop { animation: pop .4s; }
  @keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.8); }
    100% { transform: scale(1); }
  }

  /* ===== 橫幅 ===== */
  .hero {
    text-align: center; padding: 60px 20px 40px;
    background: linear-gradient(180deg, #FFE9D0, #FFF8F0);
  }
  .hero h1 { font-size: 42px; color: #8B5A2B; margin-bottom: 12px; }
  .hero p { font-size: 18px; color: #A0784A; }
  .hero .petal-deco { font-size: 24px; letter-spacing: 12px; margin-top: 16px; opacity: .7; }

  /* ===== 商品區 ===== */
  .products {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 28px;
    padding: 40px 6% 80px;
    max-width: 1200px;
    margin: 0 auto;
  }
  .card {
    background: #fff; border-radius: 20px; overflow: hidden;
    box-shadow: 0 6px 18px rgba(160, 110, 60, 0.12);
    transition: transform .3s, box-shadow .3s;
    animation: fadeUp .6s backwards;
  }
  .card:hover { transform: translateY(-8px); box-shadow: 0 14px 28px rgba(160,110,60,.22); }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .card-img {
    font-size: 84px; text-align: center; padding: 36px 0;
    background: linear-gradient(135deg, #FFF1DC, #FFE3BC);
  }
  .card-body { padding: 18px 20px 22px; }
  .card-body h3 { font-size: 19px; margin-bottom: 6px; }
  .card-body .desc { font-size: 14px; color: #A08C76; margin-bottom: 14px; min-height: 20px; }
  .card-foot { display: flex; justify-content: space-between; align-items: center; }
  .price { font-size: 21px; font-weight: bold; color: #C0392B; }
  .add-btn {
    background: #E8A353; color: #fff; border: none;
    padding: 9px 18px; border-radius: 20px; font-size: 15px;
    cursor: pointer; transition: background .2s, transform .15s;
  }
  .add-btn:hover { background: #D18A38; transform: scale(1.06); }
  .add-btn:active { transform: scale(.94); }

  /* ===== 花瓣飄落特效 ===== */
  .petal {
    position: fixed; top: -60px; z-index: 999; pointer-events: none;
    user-select: none;
    filter: drop-shadow(0 2px 3px rgba(200, 60, 120, .2));
    will-change: transform, opacity;
  }

  /* ===== 提示訊息 Toast ===== */
  .toast {
    position: fixed; bottom: 30px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #4A3728; color: #FFE9D0;
    padding: 12px 26px; border-radius: 30px; font-size: 15px;
    opacity: 0; transition: all .4s cubic-bezier(.34,1.56,.64,1);
    z-index: 1000;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ===== 購物車側邊欄 ===== */
  .cart-panel {
    position: fixed; top: 0; right: -360px; width: 340px; height: 100%;
    background: #fff; box-shadow: -6px 0 20px rgba(0,0,0,.15);
    transition: right .35s ease; z-index: 500;
    display: flex; flex-direction: column;
  }
  .cart-panel.open { right: 0; }
  .cart-head {
    padding: 20px; background: #B0733A; color: #fff;
    font-size: 20px; font-weight: bold;
    display: flex; justify-content: space-between; align-items: center;
  }
  .close-cart { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; }
  .cart-items { flex: 1; overflow-y: auto; padding: 16px; }
  .cart-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 0; border-bottom: 1px dashed #EAD9C2;
  }
  .cart-item .ci-img { font-size: 34px; }
  .cart-item .ci-info { flex: 1; }
  .cart-item .ci-name { font-size: 15px; font-weight: bold; }
  .cart-item .ci-price { font-size: 13px; color: #C0392B; }
  .qty-ctrl { display: flex; align-items: center; gap: 8px; }
  .qty-ctrl button {
    width: 26px; height: 26px; border: none; border-radius: 50%;
    background: #F0E3D0; cursor: pointer; font-size: 15px; color: #6B4E2E;
  }
  .qty-ctrl button:hover { background: #E8D5BA; }
  .cart-empty { text-align: center; color: #B9A58C; padding: 60px 0; font-size: 15px; }
  .cart-foot { padding: 18px 20px; border-top: 2px solid #F0E3D0; }
  .total { display: flex; justify-content: space-between; font-size: 18px; font-weight: bold; margin-bottom: 14px; }
  .checkout {
    width: 100%; padding: 13px; border: none; border-radius: 12px;
    background: #E2584D; color: #fff; font-size: 17px; cursor: pointer;
    transition: background .2s;
  }
  .checkout:hover { background: #C7443A; }
</style>
</head>
<body>

<header>
  <div class="logo"><span>🌸</span> 花瓣麵包坊</div>
  <button class="cart-btn" id="cartBtn">🛒 購物車 <span class="cart-count" id="cartCount">0</span></button>
</header>

<section class="hero">
  <h1>新鮮出爐的手作麵包 🍞</h1>
  <p>每日限量烘焙,花瓣飄香的好味道!</p>
  <div class="petal-deco">🌸 🌸 🌸 🌸 🌸</div>
</section>

<main class="products" id="productGrid"></main>

<!-- 購物車側邊欄 -->
<aside class="cart-panel" id="cartPanel">
  <div class="cart-head">🛒 我的購物車 <button class="close-cart" id="closeCart">✕</button></div>
  <div class="cart-items" id="cartItems"></div>
  <div class="cart-foot">
    <div class="total"><span>總計</span><span id="totalPrice">$0</span></div>
    <button class="checkout" onclick="checkout()">去結帳 ❤</button>
  </div>
</aside>

<div class="toast" id="toast">已加入購物車!</div>

<script>
/* ================= 商品資料 ================= */
const products = [
  { id: 1, name: "經典可頌",   emoji: "🥐", price: 55,  desc: "外酥內軟,奶油香氣十足" },
  { id: 2, name: "法國長棍",   emoji: "🥖", price: 80,  desc: "外皮酥脆,越嚼越香" },
  { id: 3, name: "奶香吐司",   emoji: "🍞", price: 120, desc: "柔軟拉絲,早餐必備" },
  { id: 4, name: "巧克力麵包", emoji: "🍫", price: 45,  desc: "濃郁可可,大人小孩都愛" },
  { id: 5, name: "肉桂捲",     emoji: "🌀", price: 60,  desc: "香濃肉桂,冬日暖心" },
  { id: 6, name: "紅豆菠蘿",   emoji: "🫘", price: 40,  desc: "酥皮配上綿密紅豆" },
  { id: 7, name: "櫻花餅乾",   emoji: "🌸", price: 35,  desc: "本店招牌!粉嫩又好吃" },
  { id: 8, name: "奶油餐包",   emoji: "🧈", price: 30,  desc: "小巧鬆軟,一口一個" },
];

let cart = []; // { id, qty }

/* ================= 渲染商品 ================= */
const grid = document.getElementById("productGrid");
products.forEach((p, i) => {
  const card = document.createElement("div");
  card.className = "card";
  card.style.animationDelay = (i * 0.07) + "s";
  card.innerHTML = `
    <div class="card-img">${p.emoji}</div>
    <div class="card-body">
      <h3>${p.name}</h3>
      <div class="desc">${p.desc}</div>
      <div class="card-foot">
        <span class="price">$${p.price}</span>
        <button class="add-btn" onclick="addToCart(${p.id}, this)">加入購物車</button>
      </div>
    </div>`;
  grid.appendChild(card);
});

/* ================= 加入購物車 + 花瓣特效 ================= */
function addToCart(id, btn) {
  const item = cart.find(i => i.id === id);
  if (item) item.qty++;
  else cart.push({ id, qty: 1 });

  updateCartUI();
  petalFall(btn);
  showToast();
}

/* --- 花瓣飄落特效 --- */
const PETAL_ICONS = ["🌸", "🌺", "💮", "🌷"];
const PETAL_COLORS = ["#FFB7C5", "#FF9EBB", "#FFC7DA", "#FFD1E3"];

function petalFall(fromEl) {
  const rect = fromEl.getBoundingClientRect();
  const originX = rect.left + rect.width / 2;
  const W = window.innerWidth;
  const COUNT = 16; // 花瓣數量,越多越明顯

  for (let i = 0; i < COUNT; i++) {
    const petal = document.createElement("div");
    petal.className = "petal";

    // 隨機造型:有些用 emoji,有些用 CSS 畫的彩色花瓣
    const useEmoji = Math.random() > 0.4;
    if (useEmoji) {
      petal.textContent = PETAL_ICONS[Math.floor(Math.random() * PETAL_ICONS.length)];
    } else {
      const c = PETAL_COLORS[Math.floor(Math.random() * PETAL_COLORS.length)];
      petal.style.width = "18px";
      petal.style.height = "14px";
      petal.style.background = c;
      petal.style.borderRadius = "80% 0 80% 0"; // 花瓣形狀
    }

    const size = 20 + Math.random() * 22; // 大一點更明顯
    petal.style.fontSize = size + "px";

    // 起始位置:以按鈕上方為中心,左右散開
    const startX = originX + (Math.random() - 0.5) * W * 0.9;
    petal.style.left = startX + "px";
    document.body.appendChild(petal);

    // 飄落動畫參數
    const duration = 2200 + Math.random() * 2000;      // 飄落時間
    const swayAmp  = 40 + Math.random() * 70;          // 左右搖擺幅度
    const swayFreq = 1.5 + Math.random() * 2.5;        // 搖擺頻率
    const phase    = Math.random() * Math.PI * 2;      // 搖擺起始相位
    const rotSpeed = (Math.random() - 0.5) * 540;      // 旋轉速度(角度/秒)
    const baseRot  = Math.random() * 360;
    const driftX   = (Math.random() - 0.5) * 160;      // 整體水平漂移
    const fallDist = window.innerHeight + 120;         // 落下總距離
    const startTime = performance.now();
    const delay = Math.random() * 350;                 // 錯開出現時間

    function animate(now) {
      const t = (now - startTime - delay) / duration;
      if (t < 0) { requestAnimationFrame(animate); return; }

      if (t >= 1) { petal.remove(); return; }

      const ease = t < 0.15 ? t / 0.15 * 0.15 : t; // 開頭略加速
      const y = ease * fallDist;
      const x = Math.sin(t * swayFreq * Math.PI * 2 + phase) * swayAmp * (0.3 + t) + driftX * t;
      const rot = baseRot + rotSpeed * (now - startTime - delay) / 1000;

      // 尾端淡出
      let opacity = 1;
      if (t > 0.75) opacity = 1 - (t - 0.75) / 0.25;

      petal.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg)`;
      petal.style.opacity = opacity;
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
  }

  // 購物車抖動 + 數字彈跳
  const cartBtn = document.getElementById("cartBtn");
  cartBtn.classList.add("shake");
  document.getElementById("cartCount").classList.add("pop");
  setTimeout(() => {
    cartBtn.classList.remove("shake");
    document.getElementById("cartCount").classList.remove("pop");
  }, 500);
}

/* ================= 購物車 UI ================= */
function updateCartUI() {
  const count = cart.reduce((s, i) => s + i.qty, 0);
  document.getElementById("cartCount").textContent = count;

  const box = document.getElementById("cartItems");
  if (cart.length === 0) {
    box.innerHTML = '<div class="cart-empty">購物車是空的 🌸<br>快挑幾個好吃的麵包吧!</div>';
    document.getElementById("totalPrice").textContent = "$0";
    return;
  }
  let total = 0;
  box.innerHTML = "";
  cart.forEach(i => {
    const p = products.find(p => p.id === i.id);
    total += p.price * i.qty;
    const div = document.createElement("div");
    div.className = "cart-item";
    div.innerHTML = `
      <div class="ci-img">${p.emoji}</div>
      <div class="ci-info">
        <div class="ci-name">${p.name}</div>
        <div class="ci-price">$${p.price} x ${i.qty}</div>
      </div>
      <div class="qty-ctrl">
        <button onclick="changeQty(${i.id}, -1)">−</button>
        <span>${i.qty}</span>
        <button onclick="changeQty(${i.id}, 1)">＋</button>
      </div>`;
    box.appendChild(div);
  });
  document.getElementById("totalPrice").textContent = "$" + total;
}

function changeQty(id, d) {
  const item = cart.find(i => i.id === id);
  item.qty += d;
  if (item.qty <= 0) cart = cart.filter(i => i.id !== id);
  updateCartUI();
}

function checkout() {
  if (cart.length === 0) { showToast("購物車是空的!"); return; }
  showToast("🌸 感謝購買!麵包很快出爐~");
  cart = [];
  updateCartUI();
}

/* ================= Toast ================= */
let toastTimer;
function showToast(msg = "已加入購物車! 🌸") {
  const toast = document.getElementById("toast");
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 1800);
}

/* ================= 購物車開關 ================= */
document.getElementById("cartBtn").addEventListener("click", () =>
  document.getElementById("cartPanel").classList.add("open"));
document.getElementById("closeCart").addEventListener("click", () =>
  document.getElementById("cartPanel").classList.remove("open"));

updateCartUI();
</script>
</body>
</html>
